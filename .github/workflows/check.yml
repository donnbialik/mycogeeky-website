name: Check website
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run explorer:test
      - run: node --test scripts/test-audit-integration.mjs
      - run: node --test scripts/test-survey-accessibility.mjs
      - run: npm run build
      - run: npm run explorer:scan
      - run: npm run explorer:e2e
